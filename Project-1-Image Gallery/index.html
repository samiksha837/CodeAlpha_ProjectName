
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Website Heading -->
    <header>
        <h1>My Image Gallery</h1>
        <p>Explore the beauty of nature and wildlife</p>
    </header>

    <!-- Category Filter Buttons -->
    <div class="filters">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="nature">
            Nature
        </button>

        <button class="filter-btn" data-filter="wildlife">
            Wildlife
        </button>

    </div>

    <!-- Image Gallery -->
    <main class="gallery">

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
             alt="Mountain">
        <h3>Mountain</h3>
    </div>

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800"
             alt="Lake">
        <h3>Lake</h3>
    </div>

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=800"
             alt="Forest">
        <h3>Forest</h3>
    </div>

    <div class="gallery-item" data-category="wildlife">
        <img src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?w=800"
             alt="Tiger">
        <h3>Tiger</h3>
    </div>

    <div class="gallery-item" data-category="wildlife">
        <img src="https://images.unsplash.com/photo-1484406566174-9da000fda645?w=800"
             alt="Deer">
        <h3>Deer</h3>
    </div>

    <div class="gallery-item" data-category="wildlife">
        <img src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=800"
             alt="Wildlife">
        <h3>Wildlife</h3>
    </div>



    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img src="" alt="Large preview" id="lightbox-img">

        <button class="next" id="next">&#10095;</button>

        <p id="image-caption"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
